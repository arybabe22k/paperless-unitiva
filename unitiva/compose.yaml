services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${PUBLIC_DOMAIN:?Configure PUBLIC_DOMAIN}
      DATA_FILE: /app/data/prototype.json
      USERS_FILE: /app/data/users.json
    volumes:
      - app_data:/app/data
    expose:
      - "3001"
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Configure PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on: [app]
  provision:
    profiles: [setup]
    build: .
    entrypoint: ["node", "server/manage-users.js"]
    environment:
      USERS_FILE: /app/data/users.json
      UNITIVA_USER_PASSWORD_FILE: /run/secrets/user_password
    volumes:
      - app_data:/app/data
    secrets: [user_password]
    networks: [internal]
secrets:
  user_password:
    file: ./secrets/user-password.txt
volumes:
  app_data:
  caddy_data:
  caddy_config:
networks:
  internal:
