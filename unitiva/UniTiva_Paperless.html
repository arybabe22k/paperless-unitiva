class DomainError extends Error {constructor(message,status=422){super(message);this.status=status;}}
function gate(student){
 if(!student.bankAvailable) throw new DomainError('Serviço financeiro indisponível. O acesso à matrícula fica bloqueado.',503);
 if(student.debtCents>0) throw new DomainError('Existe dívida pendente. Consulte o aviso de dívida.',423);
 if(student.year===1&&student.semester===1) throw new DomainError('A primeira matrícula será feita presencialmente na secretaria.',423);
}
function options(student,cycle,catalog){
 gate(student);
 const target=student.lastSemester===1?{year:student.lastYear,semester:2}:{year:(student.lastYear??0)+1,semester:1};
 const approved=new Set(student.approved);
 const completeYear=y=>catalog.filter(c=>c.year===y).every(c=>approved.has(c.id));
 const barrier=target.year===3&&!completeYear(1)||target.year>=4&&!completeYear(2);
 const regular=catalog.filter(c=>!barrier&&target.semester===cycle.parity&&c.year===target.year&&c.semester===target.semester&&!approved.has(c.id));
 const decorate=c=>({...c,blocked:c.requires.some(id=>!approved.has(id)),missing:c.requires.filter(id=>!approved.has(id)).map(id=>catalog.find(x=>x.id===id)?.name)});
 const backlog=catalog.filter(c=>c.semester===cycle.parity&&!approved.has(c.id)&&(c.year<target.year||c.year===target.year&&c.semester<target.semester));
 return {regular:regular.map(decorate),backlog:backlog.map(decorate),target,barrier:!!barrier,cycle};
}
function simulate(student,cycle,catalog,ids){
 if(!Array.isArray(ids)||ids.length===0||ids.some(x=>!Number.isInteger(x))||new Set(ids).size!==ids.length)throw new DomainError('Seleccione cadeiras válidas, sem repetições.');
 const offered=options(student,cycle,catalog);const eligible=[...offered.regular,...offered.backlog];
 const selected=ids.map(id=>eligible.find(c=>c.id===id));
 if(selected.some(c=>!c||c.blocked)) throw new DomainError('Selecção inválida: verifique paridade, precedências e barreiras de ciclo.');
 if(offered.regular.some(c=>!c.blocked&&!ids.includes(c.id)))throw new DomainError('As cadeiras regulares elegíveis são obrigatórias.');
 return {items:selected,totalCents:selected.reduce((s,c)=>s+c.cents,0)};
}

const MAX_FILE_BYTES=5*1024*1024;
const MAX_RECORD_BYTES=20*1024*1024;

function validateUpload(name,bytes){
 if(typeof name!=='string'||!name.trim()||name.length>180||/[\\/\x00-\x1f\x7f]/.test(name))throw Error('Nome de ficheiro inválido.');
 if(!(bytes instanceof Uint8Array)||!bytes.length)throw Error('O ficheiro está vazio.');
 if(bytes.length>MAX_FILE_BYTES)throw Error('Cada ficheiro pode ter até 5 MB.');
 const extension=name.split('.').pop().toLowerCase();
 const prefix=values=>values.every((n,i)=>bytes[i]===n);
 let mime;
 if(extension==='pdf'&&prefix([37,80,68,70,45]))mime='application/pdf';
 else if(extension==='png'&&prefix([137,80,78,71,13,10,26,10]))mime='image/png';
 else if(['jpg','jpeg'].includes(extension)&&prefix([255,216,255]))mime='image/jpeg';
 else if(extension==='docx'&&prefix([80,75,3,4])){
  const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),entries=[];
  for(let i=0;i+46<=bytes.length;i++)if(bytes[i]===80&&bytes[i+1]===75&&bytes[i+2]===1&&bytes[i+3]===2){
   const length=view.getUint16(i+28,true),extra=view.getUint16(i+30,true),comment=view.getUint16(i+32,true);
   if(i+46+length+extra+comment>bytes.length)throw Error('Documento Word inválido.');
   entries.push(new TextDecoder().decode(bytes.subarray(i+46,i+46+length)));i+=45+length+extra+comment;
  }
  if(!entries.includes('[Content_Types].xml')||!entries.includes('word/document.xml')||entries.some(n=>/vbaProject\.bin$/i.test(n)))throw Error('O ficheiro não é um documento DOCX aceite.');
  mime='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
 }
 if(!mime)throw Error('Formato inválido. Escolha PDF, DOCX, PNG ou JPG; o conteúdo deve corresponder à extensão.');
 return {name:name.trim(),mime,size:bytes.length};
}
function checkRecordQuota(files,newBytes){if(files.length>=MAX_RECORD_FILES)throw Error('Um registo pode ter até 20 anexos.');if(files.reduce((n,f)=>n+f.size,0)+newBytes>MAX_RECORD_BYTES)throw Error('Os anexos deste registo podem ocupar até 20 MB.');}

function localVisible(u,r){return !!u&&!!r&&(demoApps.find(a=>a.id===r.module)?.roles.includes(u.role)||r.approverId===u.id)&&(u.role!=='ALUNO'||r.owner===u.id)&&(u.role==='ADMIN'||!r.department||r.owner===u.id||r.approverId===u.id||(u.department===r.department&&u.faculty===r.faculty));}
async function localHash(password,salt){if(typeof password!=='string'||password.length<12||password.length>256)throw Error('A senha deve ter entre 12 e 256 caracteres.');const bytes=new TextEncoder();const key=await crypto.subtle.importKey('raw',bytes.encode(password),'PBKDF2',false,['deriveBits']);const hash=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bytes.encode(salt),iterations:100000},key,256);return Array.from(new Uint8Array(hash),x=>x.toString(16).padStart(2,'0')).join('');}

 if(route==='/auth/login'&&method==='POST'){

 if(!demoState.users.length){const salt=crypto.randomUUID();const password={salt,hash:await localHash(body.password,salt)};demoState.users.push({id:'admin',username,name:'Administrador',role:'ADMIN',faculty:'Unidade central',department:'Administração',jobTitle:'Administrador',active:true,password});if(!saveDemo())throw Error('Não foi possível guardar a conta.');}
 const u=demoState.users.find(u=>u.username===username&&u.active!==false);if(!u||await localHash(body.password,u.password.salt)!==u.password.hash)throw Error('Utilizador ou senha inválidos.');demoProfile=localPublic(u);sessionStorage.setItem('unitiva-local-profile',JSON.stringify(demoProfile));localAudit('system','Iniciou sessão');return {token:'local-session',user:demoProfile};}
 if(!demoProfile)throw Error('Entre na sua conta.');const current=demoState.users.find(u=>u.id===demoProfile.id&&u.active!==false);if(!current){demoProfile=null;throw Error('A sessão terminou.');}demoProfile=localPublic(current);
 if(route==='/directory')return demoState.users.filter(u=>u.active!==false&&(!path.includes('recordId=')||demoState.records.some(r=>r.id===new URLSearchParams(path.split('?')[1]).get('recordId')&&localVisible(demoProfile,r)&&localVisible(u,r)))).map(localPublic);
 if(route==='/notifications'&&method==='GET')return structuredClone((demoState.notifications||[]).filter(n=>n.userId===demoProfile.id&&localVisible(demoProfile,demoState.records.find(r=>r.id===n.recordId))));
 if(route==='/notifications/read'){for(const n of demoState.notifications||[])if(n.userId===demoProfile.id)n.read=true;saveDemo();return {ok:true};}
 if(route==='/users'||/^\/users\/[^/]+$/.test(route)){
 if(demoProfile.role!=='ADMIN')throw Error('Apenas o administrador gere utilizadores.');if(method==='GET')return demoState.users.map(localPublic);
 const id=method==='PATCH'?route.split('/').at(-1):null,old=demoState.users.find(u=>u.id===id);if(id&&!old)throw Error('Conta não encontrada.');
 const u={...old,...body,id:id||crypto.randomUUID(),username:String(body.username||'').trim().toLowerCase(),name:String(body.name||'').trim(),active:body.active!==false};
 if(!/^[a-z0-9._-]{3,80}$/.test(u.username)||!u.name||!['ADMIN','ALUNO','SECRETARIA','FINANCEIRO','RH','TRANSPORTE','SERVICOS','BIBLIOTECA'].includes(u.role))throw Error('Dados de utilizador inválidos.');if(!u.faculty||!u.department||!u.jobTitle)throw Error('Indique faculdade, departamento e cargo.');if(demoState.users.some(x=>x.username===u.username&&x.id!==u.id))throw Error('Este utilizador já existe.');
 if(u.role!=='ADMIN'&&u.role!=='ALUNO'&&!u.superiorId)throw Error('Associe um superior ao funcionário.');if(u.role==='ALUNO'&&!['s1','s2','s3'].includes(u.studentId))throw Error('Associe uma ficha académica.');
 if(u.superiorId){let boss=demoState.users.find(x=>x.id===u.superiorId&&x.active!==false&&x.role!=='ALUNO');if(!boss)throw Error('Superior inválido.');const seen=new Set([u.id]);while(boss){if(seen.has(boss.id))throw Error('A hierarquia não pode conter ciclos.');seen.add(boss.id);boss=demoState.users.find(x=>x.id===boss.superiorId);}}
 if(old?.role==='ADMIN'&&(u.role!=='ADMIN'||!u.active)&&!demoState.users.some(x=>x.id!==id&&x.role==='ADMIN'&&x.active!==false))throw Error('Mantenha um administrador activo.');
 if(body.password){const salt=crypto.randomUUID();u.password={salt,hash:await localHash(body.password,salt)};}else u.password=old?.password;if(!u.password)throw Error('Defina uma senha inicial.');
 demoState.users=id?demoState.users.map(x=>x.id===id?u:x):[...demoState.users,u];localAudit('system','Guardou utilizador '+u.username);return localPublic(u);}
 const match=route.match(/^\/records\/([^/]+)\/(approval|followers)$/);
 if(match){const r=demoState.records.find(r=>r.id===match[1]);if(!localVisible(demoProfile,r))throw Error('Registo não encontrado.');if(match[2]==='followers'){if(!Array.isArray(body.ids)||body.ids.some(id=>!demoState.users.some(u=>u.id===id&&u.active!==false&&localVisible(u,r))))throw Error('Seleccione utilizadores com acesso.');r.followers=[...new Set(body.ids)];localAudit(r.id,'Actualizou seguidores');}else{if(r.approverId!==demoProfile.id||r.owner===demoProfile.id||r.approval!=='PENDENTE')throw Error('Apenas o superior pode autorizar.');if(!['APROVADO','REJEITADO'].includes(body.decision))throw Error('Decisão inválida.');if(body.decision==='REJEITADO'&&!body.reason?.trim())throw Error('Indique o motivo.');r.approval=body.decision;r.approvalReason=body.reason||'';r.approvedBy=demoProfile.id;r.approvedAt=new Date().toISOString();localAudit(r.id,'Autorização: '+r.approval);}return structuredClone(r);}

 shell(`<section class="launcher"><div class="workspace-heading"><div><p class="eyebrow">UNIVERSIDADE WUTIVI</p><h1>Área de trabalho</h1><p>Os processos e documentos do seu departamento, num só lugar.</p></div><button class="primary" data-view="documentos">Abrir documentos</button></div><div class="workspace-strip"><div><strong>${me.apps.length}</strong><span>Aplicações disponíveis</span></div><div><strong>${records.filter(r=>!terminal.has(r.status)).length}</strong><span>Processos em curso</span></div><div><strong>${records.length}</strong><span>Registos no seu espaço</span></div></div><div class="application-title"><h2>Aplicações</h2><div class="launcher-search">${icon('search')}<input id="app-search" aria-label="Pesquisar aplicações" placeholder="Pesquisar aplicações…" autocomplete="off"></div></div><div class="app-grid">${me.apps.map(a=>`<button class="app-tile" data-view="${a.id}" data-app-name="${esc(a.name.toLowerCase())}"><span class="tile-icon ${a.id}">${icon(a.id)}</span><span class="tile-content"><span class="tile-label">${esc(a.name)}</span><span class="tile-description">${esc(a.description)}</span><small>${records.filter(r=>r.module===a.id).length} registos</small></span></button>`).join('')}</div><p id="no-apps" class="launcher-empty" hidden>Nenhuma aplicação corresponde à pesquisa.</p><section class="recent-work"><div class="section-heading"><h2>Processos recentes</h2><span>Actividade no seu espaço</span></div>${table(records.slice(0,5))}</section></section>`,'Aplicações','');
 document.querySelector('#app-search').oninput=e=>{let count=0;document.querySelectorAll('.app-tile').forEach(t=>{t.hidden=!t.dataset.appName.includes(e.target.value.toLowerCase());if(!t.hidden)count++;});document.querySelector('#no-apps').hidden=count>0;};return;
 }
 const mod=me.apps.find(a=>a.id===view);if(!mod)return navigate('home');
 const list=records.filter(r=>r.module===view);
 const content=`<div class="action-bar"><div class="action-left">${mod.roles.includes(me.user.role)?'<button class="primary" id="create">Novo</button>':''}<span class="record-kind">${esc(mod.kind)}</span></div><div class="record-search">${icon('search')}<input id="search" type="search" value="${esc(search)}" aria-label="Pesquisar registos" placeholder="Pesquisar…"><details class="filter-menu"><summary aria-label="Filtros e agrupamento">⌄</summary><div class="filter-dropdown"><label>Filtros<select id="filter"><option value="all">Todos os estados</option>${[...new Set(list.map(r=>r.status))].map(s=>`<option value="${s}" ${statusFilter===s?'selected':''}>${labels[s]||esc(s)}</option>`).join('')}</select></label><label class="check-label"><input id="group" type="checkbox" ${groupBy?'checked':''}>Agrupar por estado</label></div></details></div><div class="view-controls"><span id="record-count">${filteredRecords().length} registos</span><button data-display="list" class="${displayMode==='list'?'selected':''}" aria-label="Vista de lista" aria-pressed="${displayMode==='list'}">${icon('list')}</button><button data-display="kanban" class="${displayMode==='kanban'?'selected':''}" aria-label="Vista Kanban" aria-pressed="${displayMode==='kanban'}">${icon('kanban')}</button></div></div><div class="search-chips" id="search-chips"></div>${view==='academico'&&me.user.role==='ALUNO'?'<div class="enrollment-shortcut"><span>Matrícula académica · seleccione cadeiras e calcule o valor.</span><button data-view="matricula">Abrir matrícula</button></div>':''}<div class="record-surface" id="list">${recordView()}</div>`;
 shell(content,moduleNames[view],'');
 document.querySelector('#search').oninput=e=>{search=e.target.value;updateRecords();};
 document.querySelector('#filter').onchange=e=>{statusFilter=e.target.value;updateRecords();};
 document.querySelector('#group').onchange=e=>{groupBy=e.target.checked;updateRecords();};updateChips();
}
function updateChips(){const box=document.querySelector('#search-chips');if(!box)return;box.innerHTML=`${search?'<span class="search-chip">Pesquisa: '+esc(search)+'</span>':''}${statusFilter!=='all'?'<span class="search-chip">Estado: '+esc(labels[statusFilter]||statusFilter)+'</span>':''}${groupBy?'<span class="search-chip">Agrupar por estado</span>':''}${search||statusFilter!=='all'||groupBy?'<button id="clear-filters">Limpar filtros</button>':''}`;box.querySelector('#clear-filters')?.addEventListener('click',()=>{search='';statusFilter='all';groupBy=false;render();});}
function updateRecords(){document.querySelector('#list').innerHTML=recordView();document.querySelector('#record-count').textContent=filteredRecords().length+' registos';updateChips();bind();}
function recordView(){const list=filteredRecords();if(displayMode==='kanban')return kanban(list);if(!groupBy)return table(list);return [...new Set(list.map(r=>r.status))].map(status=>`<section class="list-group"><h3>${esc(labels[status]||status)} <small>${list.filter(r=>r.status===status).length}</small></h3>${table(list.filter(r=>r.status===status))}</section>`).join('')||table([]);}
function kanban(list){const columns=[...new Set([...(stages[view]||[]),...list.map(r=>r.status)])];return `<div class="kanban-board">${columns.filter(s=>statusFilter==='all'||s===statusFilter).map(s=>`<section class="kanban-column"><div class="column-heading"><strong>${esc(labels[s]||s)}</strong><span>${list.filter(r=>r.status===s).length}</span></div>${list.filter(r=>r.status===s).map(r=>`<button class="kanban-card" data-detail="${r.id}"><strong>${esc(r.title)}</strong><small>${esc(r.code||r.id)}</small><p>${esc(r.description.slice(0,110))}</p>${r.amountCents?`<b>${money(r.amountCents)}</b>`:''}<div><span>${esc(new Date(r.createdAt).toLocaleDateString('pt-MZ'))}</span><span class="card-avatar">${esc((me.user.role=== 'ALUNO'?'E':r.owner).slice(0,1).toUpperCase())}</span></div></button>`).join('')}<span class="column-empty" ${list.some(r=>r.status===s)?'hidden':''}>Sem registos nesta etapa</span></section>`).join('')}</div>`;}
function table(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Registo</th><th>Estado</th><th>Criado em</th><th></th></tr></thead><tbody>${list.map(r=>`<tr><td><strong>${esc(r.title)}</strong><small>${esc(r.code||r.id)} · ${esc(r.description.slice(0,90))}</small></td><td><span class="badge ${terminal.has(r.status)?'done':''}">${labels[r.status]||esc(r.status)}</span>${r.approval?`<small>Autorização: ${esc(r.approval)}</small>`:''}</td><td>${esc(new Date(r.createdAt).toLocaleDateString('pt-MZ'))}</td><td><button class="text-button" data-detail="${r.id}">Ver detalhes</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><span>▤</span><h3>Nenhum registo por aqui</h3><p>Crie um registo para iniciar o processo.</p></div>';}
function modal(title,content){document.querySelector('dialog')?.remove();const d=document.createElement('dialog');d.innerHTML=`<div class="dialog-heading"><h2>${esc(title)}</h2><button id="close" aria-label="Fechar">×</button></div>${content}`;document.body.append(d);d.querySelector('#close').onclick=()=>d.close();d.addEventListener('close',()=>d.remove());d.showModal();return d;}
function createRecord(){
 const a=me.apps.find(a=>a.id===view);activeRecord=null;
 shell(`<div class="form-action-bar"><button class="primary" id="save-new" type="submit" form="record-form">Guardar</button><button class="secondary" id="discard">Descartar</button><span>Novo ${esc(a.kind.toLowerCase())}</span></div><div class="record-layout"><section class="form-sheet"><p class="sheet-label">${esc(a.kind.toUpperCase())}</p><form id="record-form"><input class="title-input" aria-label="Título" name="title" required minlength="3" maxlength="150" placeholder="Título do registo"><div class="field-grid"><div><label>Módulo</label><p>${esc(a.name)}</p></div><div><label>Responsável pelo registo</label><p>${esc(me.user.name)}</p></div>${view==='financeiro'?'<label>Valor (MT)<input name="amount" type="number" min="0.01" max="10000000" step="0.01" required></label>':''}<div><label>Estado inicial</label><p>${esc(labels[stages[view][0]])}</p></div></div><div class="sheet-tabs"><span class="active">Descrição</span></div><textarea name="description" maxlength="2000" rows="7" required placeholder="Descreva o pedido ou documento…" aria-label="Descrição"></textarea></form></section><aside class="chatter"><div class="chatter-heading">${icon('note')}<strong>Histórico de actividade</strong></div><div class="chatter-empty"><p>Guarde o registo para começar o histórico.</p><small>Acções e notas ficam associadas a este processo.</small></div></aside></div>`,'Novo registo','');
 document.querySelector('#discard').onclick=()=>render();
 document.querySelector('#record-form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#save-new');b.disabled=true;const f=new FormData(e.target);try{const r=await api('/records','POST',{module:view,title:f.get('title'),description:f.get('description'),amount:Number(f.get('amount'))});records.unshift(r);toast('Registo guardado.');await detail(r.id);}catch(error){toast(error.message,true);b.disabled=false;}};
}
async function detail(id){
 try{
 const r=records.find(x=>x.id===id);if(!r)return;const history=await api('/records/'+id+'/activity');const files=await api('/records/'+id+'/files');activeRecord=id;view=r.module;
 const route=r.type==='MATRICULA'?['PENDENTE']:(stages[r.module]||[r.status]);
 const canAdvance=(!r.approval||r.approval==='APROVADO')&&!terminal.has(r.status)&&r.type!=='MATRICULA'&&me.user.role!=='ALUNO';
 const people=await api('/directory?recordId='+id);const canEdit=r.type!=='MATRICULA'&&(me.user.role!=='ALUNO'||r.status==='SECRETARIA_FACULDADE');
 shell(`<div class="form-action-bar"><div class="form-actions"><button class="secondary" id="back-list">Voltar à lista</button>${canEdit?'<button class="primary" id="edit-record">Editar</button>':''}${canAdvance?`<button id="advance" class="secondary">${r.module==='financeiro'?'Registar pagamento':'Avançar etapa'}</button>`:''}</div><div class="status-path" aria-label="Etapas do processo">${route.map(s=>`<span class="${r.status===s?'current':''}">${esc(labels[s]||s)}</span>`).join('')}</div></div><div class="record-layout"><section class="form-sheet"><p class="sheet-label">${esc(me.apps.find(a=>a.id===view)?.kind||'Matrícula')} · ${esc(r.code||r.id)}</p><h1 class="record-title">${esc(r.title)}</h1><div class="field-grid"><div><label>Estado</label><p><span class="badge ${terminal.has(r.status)?'done':''}">${esc(labels[r.status]||r.status)}</span></p></div><div><label>Criado em</label><p>${date(r.createdAt)}</p></div><div><label>Criado por</label><p>${esc(history.find(h=>h.action==='Criou o registo'||h.action.startsWith('Submeteu'))?.actor||r.owner)}</p></div>${r.amountCents?`<div><label>Valor total</label><p class="field-amount">${money(r.amountCents)}</p></div>`:''}</div><div class="sheet-tabs"><span class="active">Descrição</span></div><p class="record-description">${esc(r.description)}</p>${r.items?`<h3>Cadeiras seleccionadas</h3><div class="table-wrap"><table><thead><tr><th>Cadeira</th><th>Ano / semestre</th><th>Valor</th></tr></thead><tbody>${r.items.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.year}.º / ${c.semester}.º</td><td>${money(c.cents)}</td></tr>`).join('')}</tbody></table></div>`:''}${r.paymentReference?'<div class="notice">Referência interna: '+esc(r.paymentReference)+'</div>':''}${r.type==='MATRICULA'?'<div class="notice">Pedido pendente de confirmação financeira.</div>':''}${r.status==='AGUARDA_ASSINATURA'?'<div class="notice">Processo encaminhado para assinatura. Aguarda documento assinado.</div>':''}${r.approval?`<div class="notice"><strong>Autorização: ${esc(r.approval)}</strong><p>Superior: ${esc(people.find(u=>u.id===r.approverId)?.name||'Conta indisponível')}</p>${r.approvalReason?`<p>${esc(r.approvalReason)}</p>`:''}${r.approverId===me.user.id&&r.owner!==me.user.id&&r.approval==='PENDENTE'?'<button id="approve-record" class="primary">Autorizar</button> <button id="reject-record" class="secondary">Rejeitar</button>':''}</div>`:''}${attachmentPanel(r,files)}</section><aside class="chatter"><div class="chatter-heading">${icon('note')}<strong>Histórico de actividade</strong></div><section class="followers"><strong>Seguidores</strong><p>${(r.followers||[]).map(id=>esc(people.find(u=>u.id===id)?.name||id)).join(', ')||'Sem seguidores'}</p><button id="manage-followers" class="secondary">Gerir seguidores</button></section><form id="note-form"><label for="note-text">Adicionar nota interna</label><textarea id="note-text" name="note" required maxlength="2000" rows="3" placeholder="Escreva uma nota ou mencione @utilizador…"></textarea><button class="secondary">Registar nota</button></form><ol class="timeline">${history.map(h=>`<li><span class="activity-avatar">${esc(h.actor.slice(0,1))}</span><div><strong>${esc(h.actor)}</strong><span class="activity-time">${date(h.at)}</span><p>${esc(h.action)}</p>${h.note?`<div class="activity-note">${esc(h.note)}</div>`:''}<small>${esc(h.role)}</small></div></li>`).join('')}</ol></aside></div>`,r.title,'');
 bindAttachments(r.id,files);
 const decide=async decision=>{let reason='';if(decision==='REJEITADO'){reason=prompt('Motivo da rejeição');if(!reason)return;}try{const updated=await api('/records/'+id+'/approval','PATCH',{decision,reason});records=records.map(x=>x.id===id?updated:x);await detail(id);}catch(e){toast(e.message,true);}};
 document.querySelector('#approve-record')?.addEventListener('click',()=>decide('APROVADO'));document.querySelector('#reject-record')?.addEventListener('click',()=>decide('REJEITADO'));
 document.querySelector('#manage-followers').onclick=()=>{const eligible=people;const d=modal('Seguidores do processo',`<form>${eligible.map(u=>`<label class="check-label"><input type="checkbox" name="ids" value="${u.id}" ${(r.followers||[]).includes(u.id)?'checked':''}>${esc(u.name)} · @${esc(u.username||u.id)}</label>`).join('')}<button class="primary">Guardar seguidores</button></form>`);d.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const updated=await api('/records/'+id+'/followers','POST',{ids:new FormData(e.target).getAll('ids')});records=records.map(x=>x.id===id?updated:x);d.close();await detail(id);}catch(error){toast(error.message,true);}};};
 const mention=document.createElement('select');mention.setAttribute('aria-label','Mencionar utilizador');mention.innerHTML='<option value="">Mencionar utilizador…</option>'+people.map(u=>`<option value="${esc(u.username||u.id)}">${esc(u.name)}</option>`).join('');document.querySelector('#note-text').after(mention);mention.onchange=()=>{document.querySelector('#note-text').value+=' @'+mention.value+' ';mention.value='';};
 document.querySelector('#back-list').onclick=()=>{activeRecord=null;render();};
 document.querySelector('#advance')?.addEventListener('click',async e=>{e.target.disabled=true;try{const updated=await api('/records/'+id+'/advance','PATCH',{});records=records.map(x=>x.id===id?updated:x);await detail(id);toast('Etapa actualizada.');}catch(error){toast(error.message,true);e.target.disabled=false;}});
 document.querySelector('#edit-record')?.addEventListener('click',()=>editRecord(r));
 document.querySelector('#note-form').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{await api('/records/'+id+'/notes','POST',{note:new FormData(e.target).get('note')});await detail(id);toast('Nota registada no histórico.');}catch(error){toast(error.message,true);e.submitter.disabled=false;}};
 }catch(e){toast(e.message,true);}
}
function editRecord(r){
 const d=modal('Editar registo',`<form><label>Título<input name="title" value="${esc(r.title)}" required minlength="3" maxlength="150"></label><label>Descrição<textarea name="description" rows="5" required maxlength="2000">${esc(r.description)}</textarea></label>${r.module==='financeiro'?`<label>Valor (MT)<input name="amount" type="number" min="0.01" max="10000000" step="0.01" value="${r.amountCents/100}" required ${r.status!=='EMITIDA'?'disabled':''}></label>`:''}<button class="primary">Guardar alterações</button></form>`);
 d.querySelector('form').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;const f=new FormData(e.target);try{const updated=await api('/records/'+r.id,'PATCH',{title:f.get('title'),description:f.get('description'),amount:r.module==='financeiro'?(f.get('amount')===null?r.amountCents/100:Number(f.get('amount'))):0});records=records.map(x=>x.id===r.id?updated:x);d.close();await detail(r.id);toast('Alterações guardadas.');}catch(error){toast(error.message,true);e.submitter.disabled=false;}};
}

function fileSize(bytes){return bytes<1024*1024?(bytes/1024).toFixed(1)+' KB':(bytes/1024/1024).toFixed(1)+' MB';}
function attachmentPanel(r,files){return `<section class="attachments"><div class="section-heading"><h3>Documentos anexados</h3><span>${files.length} ficheiros</span></div><div class="upload-zone" id="upload-zone"><label for="file-input">${icon('note')}<strong>Escolher documentos ou arrastar para aqui</strong><span>PDF, DOCX, PNG e JPG · até 5 MB por ficheiro</span></label><input id="file-input" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg" multiple><p id="upload-status" role="status" aria-live="polite"></p></div><div class="attachment-list">${files.map(f=>`<article class="attachment-row"><span class="file-kind">${esc(f.name.split('.').pop().toUpperCase())}</span><div><strong>${esc(f.name)}</strong><small>${fileSize(f.size)} · ${esc(f.uploadedBy)} · ${date(f.uploadedAt)}</small></div><div class="file-actions"><button data-open-file="${f.id}">Ver</button><button data-download-file="${f.id}">Descarregar</button>${me.user.role==='ADMIN'||me.user.id===f.uploadedById?`<button data-remove-file="${f.id}">Remover</button>`:''}</div></article>`).join('')||'<p class="no-attachments">Nenhum documento anexado. Adicione os ficheiros deste processo.</p>'}</div></section>`;}
function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(Error('Não foi possível ler o ficheiro.'));reader.readAsDataURL(file);});}
async function uploadFiles(recordId,files){if(uploadBusy){toast('Aguarde a conclusão do upload em curso.',true);return;}uploadBusy=true;const status=document.querySelector('#upload-status');const input=document.querySelector('#file-input');let success=0;const errors=[];if(input)input.disabled=true;try{for(const file of files){if(status)status.textContent='A guardar '+file.name+'…';try{if(file.size>5*1024*1024)throw Error('Cada ficheiro pode ter até 5 MB.');if(!/\.(pdf|docx|png|jpe?g)$/i.test(file.name))throw Error('Formato não aceite.');const dataBase64=await fileToBase64(file);await api('/records/'+recordId+'/files','POST',{name:file.name,dataBase64});success++;}catch(e){errors.push(file.name+': '+e.message);}}if(view==='documentos')await documentHub();else await detail(recordId);if(success)toast(success+' documento(s) guardado(s).');if(errors.length){const box=document.querySelector('#upload-status');if(box)box.textContent=errors.join(' · ');toast(errors.join(' · '),true);}}finally{uploadBusy=false;if(input)input.disabled=false;}}
function bindAttachments(recordId,files){const input=document.querySelector('#file-input');if(input)input.onchange=()=>uploadFiles(recordId,Array.from(input.files||[]));const zone=document.querySelector('#upload-zone');if(zone){zone.ondragover=e=>{e.preventDefault();zone.classList.add('dragging');};zone.ondragleave=()=>zone.classList.remove('dragging');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('dragging');uploadFiles(recordId,Array.from(e.dataTransfer.files||[]));};}document.querySelectorAll('[data-open-file]').forEach(b=>b.onclick=()=>openFile(files.find(f=>f.id===b.dataset.openFile)));document.querySelectorAll('[data-download-file]').forEach(b=>b.onclick=()=>openFile(files.find(f=>f.id===b.dataset.downloadFile),true));document.querySelectorAll('[data-remove-file]').forEach(b=>b.onclick=()=>removeFile(files.find(f=>f.id===b.dataset.removeFile)));}
async function openFile(meta,download=false){try{const f=await api('/records/'+meta.recordId+'/files/'+meta.id),raw=atob(f.dataBase64),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),blob=new Blob([bytes],{type:f.mime}),url=URL.createObjectURL(blob);const makeDownload=()=>{const a=document.createElement('a');a.href=url;a.download=f.name;document.body.append(a);a.click();a.remove();};if(download){makeDownload();setTimeout(()=>URL.revokeObjectURL(url),60000);return;}const d=modal(f.name,`<div class="file-preview">${f.mime.startsWith('image/')?`<img src="${url}" alt="${esc(f.name)}">`:f.mime==='application/pdf'?`<iframe src="${url}" title="Pré-visualização do PDF" sandbox></iframe>`:'<p>Os documentos Word podem ser descarregados e abertos no seu editor.</p>'}</div><button class="primary" id="download-preview">Descarregar ficheiro</button><p class="muted">Se a pré-visualização não estiver disponível, descarregue o documento.</p>`);d.querySelector('#download-preview').onclick=makeDownload;d.addEventListener('close',()=>URL.revokeObjectURL(url));}catch(e){toast(e.message,true);}}
function removeFile(f){const d=modal('Remover documento',`<p>Remover <strong>${esc(f.name)}</strong> deste processo?</p><p class="muted">A remoção ficará registada no histórico.</p><button class="danger-button" id="confirm-remove">Remover documento</button>`);d.querySelector('#confirm-remove').onclick=async e=>{e.target.disabled=true;try{await api('/records/'+f.recordId+'/files/'+f.id,'DELETE');d.close();if(view==='documentos')await documentHub();else await detail(f.recordId);toast('Documento removido.');}catch(error){toast(error.message,true);e.target.disabled=false;}};}
async function documentHub(){view='documentos';try{allFiles=await api('/files');shell(`<div class="document-page"><div class="workspace-heading"><div><p class="eyebrow">ARQUIVO DO SEU ESPAÇO</p><h1>Centro de documentos</h1><p>Anexe documentos aos processos e consulte o arquivo do seu departamento.</p></div><button class="primary" id="hub-upload">+ Carregar documento</button></div><div class="document-controls"><label>Pesquisar documentos<input id="document-search" type="search" placeholder="Nome do ficheiro ou processo"></label><label>Formato<select id="document-type"><option value="all">Todos os formatos</option><option value="pdf">PDF</option><option value="docx">Word</option><option value="image">Imagens</option></select></label><span id="document-count">${allFiles.length} documentos</span></div><section id="document-list">${documentList(allFiles)}</section><p class="module-footnote">Os documentos seguem as permissões do processo a que estão associados. </p></div>`,'Documentos','');document.querySelector('#hub-upload').onclick=hubUpload;const filter=()=>{const q=document.querySelector('#document-search').value.toLowerCase(),type=document.querySelector('#document-type').value;const list=allFiles.filter(f=>(f.name+' '+((records.find(r=>r.id===f.recordId)?.code||'')+' '+(records.find(r=>r.id===f.recordId)?.title||''))).toLowerCase().includes(q)&&(type==='all'||type==='image'&&f.mime.startsWith('image/')||type==='pdf'&&f.mime==='application/pdf'||type==='docx'&&f.name.toLowerCase().endsWith('.docx')));document.querySelector('#document-list').innerHTML=documentList(list);document.querySelector('#document-count').textContent=list.length+' documentos';bindDocumentList();};document.querySelector('#document-search').oninput=filter;document.querySelector('#document-type').onchange=filter;bindDocumentList();}catch(e){toast(e.message,true);}}
function documentList(files){return files.length?`<div class="document-grid">${files.map(f=>`<article class="document-card"><div class="document-card-top"><span class="file-kind">${esc(f.name.split('.').pop().toUpperCase())}</span><small>${fileSize(f.size)}</small></div><h3>${esc(f.name)}</h3><p>${esc(records.find(r=>r.id===f.recordId)?.title||'Processo')}</p><small>${esc(f.uploadedBy)} · ${esc(new Date(f.uploadedAt).toLocaleDateString('pt-MZ'))}</small><div class="document-card-actions"><button data-open-file="${f.id}">Ver documento</button><button data-detail="${f.recordId}">Processo</button><button data-download-file="${f.id}" aria-label="Descarregar ${esc(f.name)}">Descarregar</button></div></article>`).join('')}</div>`:'<div class="documents-empty">'+icon('note')+'<h2>O seu arquivo começa aqui</h2><p>Carregue o primeiro documento e associe-o a um processo.</p><button class="secondary" id="first-upload">Carregar documento</button></div>';}
function bindDocumentList(){bind();document.querySelectorAll('[data-open-file]').forEach(b=>b.onclick=()=>openFile(allFiles.find(f=>f.id===b.dataset.openFile)));document.querySelectorAll('[data-download-file]').forEach(b=>b.onclick=()=>openFile(allFiles.find(f=>f.id===b.dataset.downloadFile),true));const first=document.querySelector('#first-upload');if(first)first.onclick=hubUpload;}
function hubUpload(){if(!records.length){toast('Crie primeiro um processo numa das suas aplicações.',true);return;}const d=modal('Carregar documento',`<form id="hub-file-form"><label>Associar ao processo<select name="record" required>${records.map(r=>`<option value="${r.id}">${esc(r.code||r.id)} · ${esc(r.title)}</option>`).join('')}</select></label><label>Documentos<input name="files" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg" multiple required></label><p class="muted">PDF, DOCX, PNG e JPG · até 5 MB por ficheiro.</p><button class="primary">Guardar documentos</button></form>`);d.querySelector('form').onsubmit=e=>{e.preventDefault();const recordId=e.target.elements.record.value,files=Array.from(e.target.elements.files.files);d.close();uploadFiles(recordId,files);};}
async function matricula(){offered=null;const s=me.student;let error='';try{offered=await api('/matricula/opcoes');selected=new Set(offered.regular.filter(c=>!c.blocked).map(c=>c.id));}catch(e){error=e.message;}
const scenarios='';
const courses=list=>list.length?list.map(c=>`<label class="course"><input type="checkbox" value="${c.id}" ${selected.has(c.id)?'checked':''} ${c.blocked||offered.regular.some(x=>x.id===c.id)?'disabled':''}><span><strong>${esc(c.name)}</strong><small>${c.year}.º ano · ${c.semester}.º semestre${c.blocked?' · Requer aprovação em '+esc(c.missing.join(', ')):''}</small></span><span>${money(c.cents)}</span></label>`).join(''):'<p class="muted">Sem cadeiras disponíveis neste grupo.</p>';
shell(`<div class="student-strip"><div><span class="avatar">E</span><div><strong>${esc(s.name)}</strong><p>${esc(s.code)} · ${esc(s.course)}</p></div></div><span class="badge">${s.year}.º ano / ${s.semester}.º semestre</span></div>${scenarios}${error?`<div class="notice danger"><strong>Acesso à matrícula bloqueado</strong><p>${esc(error)}</p>${s.debtCents>0?'<button class="secondary" id="debt">Consultar aviso de dívida</button>':''}</div>`:`${offered.barrier?'<div class="notice danger">Barreira de ciclo: conclua as cadeiras exigidas dos anos anteriores.</div>':''}<div class="enrollment"><section class="panel"><h2>Grupo 1 · Cadeiras regulares</h2><p class="muted">As cadeiras regulares elegíveis são obrigatórias.</p>${courses(offered.regular)}<h2 class="history-title">Grupo 2 · Cadeiras em atraso</h2><p class="muted">Adicione as cadeiras que pretende recuperar.</p>${courses(offered.backlog)}</section><section class="panel summary"><p class="eyebrow">RESUMO DA MATRÍCULA</p><h2>${esc(offered.cycle.year)}</h2><p>Ciclo ${offered.cycle.parity===1?'ímpar':'par'}</p><div id="total"></div><button id="simulate" class="secondary">Calcular valor</button><button id="submit" class="primary">Submeter matrícula</button><small>A submissão cria um pedido pendente. Não confirma um pagamento.</small></section></div>`}`,'A minha matrícula','Seleccione as cadeiras e valide o valor antes de submeter.');
document.querySelector('#debt')?.addEventListener('click',async()=>{try{const d=await api('/matricula/divida');modal('Aviso de dívida',`<p>Código: ${esc(d.code)}</p><h2>${money(d.debtCents)}</h2><p>${esc(d.notice)}</p><p>Este aviso não serve para efectuar pagamentos.</p>`);}catch(e){toast(e.message,true);}});
if(!offered)return;const total=()=>{const all=[...offered.regular,...offered.backlog];document.querySelector('#total').innerHTML=`<p>${selected.size} cadeiras seleccionadas</p><strong>${money(all.filter(c=>selected.has(c.id)).reduce((n,c)=>n+c.cents,0))}</strong>`;document.querySelector('#submit').disabled=selected.size===0;};total();document.querySelectorAll('.course input:not([disabled])').forEach(c=>c.onchange=()=>{const id=Number(c.value);if(c.checked)selected.add(id);else selected.delete(id);total();});document.querySelector('#simulate').onclick=async()=>{try{const calc=await api('/matricula/simular','POST',{ids:[...selected]});toast('Selecção validada · '+money(calc.totalCents));}catch(e){toast(e.message,true);}};
document.querySelector('#submit').onclick=async e=>{e.target.disabled=true;try{const r=await api('/matricula/submeter','POST',{ids:[...selected]});records.unshift(r);toast('Matrícula submetida. Estado: pendente.');await navigate('academico');await detail(r.id);}catch(error){toast(error.message,true);e.target.disabled=false;}};}
load().catch(()=>loginScreen());

async function usersPage(){view='utilizadores';try{const users=await api('/users');shell(`<section class="launcher"><div class="workspace-heading"><h1>Utilizadores</h1><button id="new-user" class="primary">Criar utilizador</button></div><div class="table-wrap"><table><thead><tr><th>Funcionário</th><th>Faculdade / departamento</th><th>Cargo / superior</th><th>Estado</th><th></th></tr></thead><tbody>${users.map(u=>`<tr><td><strong>${esc(u.name)}</strong><small>@${esc(u.username)}</small></td><td>${esc(u.faculty)}<small>${esc(u.department)}</small></td><td>${esc(u.jobTitle)}<small>${esc(users.find(x=>x.id===u.superiorId)?.name||'Sem superior')}</small></td><td>${u.active===false?'Inactivo':'Activo'}</td><td><button data-edit-user="${u.id}">Editar</button></td></tr>`).join('')}</tbody></table></div></section>`,'Utilizadores','');const edit=(u={})=>{const d=modal(u.id?'Editar utilizador':'Criar utilizador',`<form>${[['name','Nome completo'],['username','Utilizador'],['faculty','Faculdade ou unidade central'],['department','Departamento'],['jobTitle','Cargo']].map(([key,label])=>`<label>${label}<input name="${key}" required maxlength="150" value="${esc(u[key]||'')}"></label>`).join('')}<label>Perfil de acesso<select name="role">${['SECRETARIA','FINANCEIRO','RH','TRANSPORTE','SERVICOS','BIBLIOTECA','ADMIN','ALUNO'].map(role=>`<option ${u.role===role?'selected':''}>${role}</option>`).join('')}</select></label><label>Superior hierárquico<select name="superiorId"><option value="">Sem superior</option>${users.filter(x=>x.id!==u.id&&x.active!==false&&x.role!=='ALUNO').map(x=>`<option value="${x.id}" ${u.superiorId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Ficha académica (estudantes)<select name="studentId"><option value="">Não se aplica</option>${['s1','s2','s3'].map(id=>`<option ${u.studentId===id?'selected':''}>${id}</option>`).join('')}</select></label><label>${u.id?'Nova senha (deixe vazio para manter)':'Senha inicial'}<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" ${u.id?'':'required'}></label><label class="check-label"><input name="active" type="checkbox" ${u.active!==false?'checked':''}>Conta activa</label><button class="primary">Guardar utilizador</button></form>`);d.querySelector('form').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;const body=Object.fromEntries(new FormData(e.target));body.active=e.target.elements.active.checked;try{await api('/users'+(u.id?'/'+u.id:''),u.id?'PATCH':'POST',body);d.close();await usersPage();toast('Utilizador guardado.');}catch(error){toast(error.message,true);e.submitter.disabled=false;}};};document.querySelector('#new-user').onclick=()=>edit();document.querySelectorAll('[data-edit-user]').forEach(b=>b.onclick=()=>edit(users.find(u=>u.id===b.dataset.editUser)));}catch(e){toast(e.message,true);}}
async function notificationsPage(){view='notificacoes';try{records=await api('/records');const list=await api('/notifications');shell(`<section class="launcher"><div class="workspace-heading"><h1>Notificações</h1><button id="read-notices" class="secondary">Marcar como lidas</button></div>${list.map(n=>`<article class="panel"><strong>${n.read?'':'● '}${esc(records.find(r=>r.id===n.recordId)?.code||'Processo')}</strong><p>${esc(n.action)}</p><small>${date(n.at)}</small> <button data-detail="${n.recordId}">Abrir processo</button></article>`).join('')||'<p>Sem actualizações por consultar.</p>'}</section>`,'Notificações','');document.querySelector('#read-notices').onclick=async()=>{await api('/notifications/read','PATCH',{});await notificationsPage();};}catch(e){toast(e.message,true);}}
</script></body></html>
